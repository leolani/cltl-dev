services:
  diagnostics:
    build:
      context: diagnostics/
      additional_contexts:
        leolani: ../../../../cltl-requirements/leolani
      args:
        base_image: ghcr.io/leolani/cltl-base:latest
    image: cltl/eliza-diagnostics
    container_name: eliza-diagnostics
    volumes:
      - ../../config-server:/app/config
      - ./diagnostics/payloads:/app/payloads
    environment:
      - CLTL_LOGGING_CONFIG=/app/config/logging.config
    networks:
      - eliza-network

networks:
  eliza-network:
    external: true    # created by docker-compose.server.yml
