# Compose override for client/server split — server-side integration tests.
# Usage:
#   docker compose --project-name eliza-csplit-server \
#     -f docker-compose.server.yml \
#     -f tests/integration/docker-compose.csplit-server-test.yml \
#     up -d --wait
#
# Per service this override:
#   - Keeps the shared ./config-server directory from the base compose
#   - Bind-mounts tests/integration/config/custom.config (disables mic, image, ASR)
#   - Bind-mounts tests/integration/config/logging.config
#   - Redirects storage to tests/integration/storage-csplit-server/ to isolate test artefacts
#
# The production ./storage/ is never touched by test runs.

services:
  rabbitmq:
    volumes:
      - ./tests/integration/storage-csplit-server/rabbitmq:/var/lib/rabbitmq

  eliza-backend:
    volumes:
      - ./config-server:/cltl-backend/config
      - ./tests/integration/config/custom.config:/cltl-backend/config/custom.config
      - ./tests/integration/config/logging.config:/cltl-backend/config/logging.config
      - ./tests/integration/storage-csplit-server:/cltl-backend/storage

  eliza-vad:
    volumes:
      - ./config-server:/cltl-vad/config
      - ./tests/integration/config/custom.config:/cltl-vad/config/custom.config
      - ./tests/integration/config/logging.config:/cltl-vad/config/logging.config
      - ./tests/integration/storage-csplit-server:/cltl-vad/storage

  eliza-asr:
    volumes:
      - ./config-server:/cltl-asr/config
      - ./tests/integration/config/custom.config:/cltl-asr/config/custom.config
      - ./tests/integration/config/logging.config:/cltl-asr/config/logging.config
      - ./tests/integration/storage-csplit-server:/cltl-asr/storage

  eliza-emissor:
    volumes:
      - ./config-server:/cltl-emissor-data/config
      - ./tests/integration/config/custom.config:/cltl-emissor-data/config/custom.config
      - ./tests/integration/config/logging.config:/cltl-emissor-data/config/logging.config
      - ./tests/integration/storage-csplit-server:/cltl-emissor-data/storage

  eliza-eliza:
    volumes:
      - ./config-server:/cltl-eliza/config
      - ./tests/integration/config/custom.config:/cltl-eliza/config/custom.config
      - ./tests/integration/config/logging.config:/cltl-eliza/config/logging.config
      - ./tests/integration/storage-csplit-server:/cltl-eliza/storage

