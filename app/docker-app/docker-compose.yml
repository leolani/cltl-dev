services:
  rabbitmq:
    image: "rabbitmq:3.12-management"
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=eliza
      - RABBITMQ_DEFAULT_PASS=eliza123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - ./storage/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - eliza-network

  eliza-backend:
    image: ghcr.io/leolani/cltl-backend:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    ports:
      - "8001:8000"
    volumes:
      - ./config:/cltl-backend/config
      - ./storage:/cltl-backend/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-backend/config/logging.config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-vad:
    image: ghcr.io/leolani/cltl-vad:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-vad
    volumes:
      - ./config:/cltl-vad/config
      - ./storage:/cltl-vad/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-vad/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-asr:
    image: ghcr.io/leolani/cltl-asr:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-asr
    volumes:
      - ./config:/cltl-asr/config
      - ./storage:/cltl-asr/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-asr/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-emissor:
    image: ghcr.io/leolani/cltl-emissor-data:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-emissor
    ports:
      - "8002:8000"
    volumes:
      - ./config:/cltl-emissor-data/config
      - ./storage:/cltl-emissor-data/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-emissor-data/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-eliza:
    image: ghcr.io/leolani/cltl-eliza:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-eliza
    volumes:
      - ./config:/cltl-eliza/config
      - ./storage:/cltl-eliza/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-eliza/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-context:
    image: ghcr.io/leolani/cltl-context:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-context
    volumes:
      - ./config:/cltl-context/config
      - ./storage:/cltl-context/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-context/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
      eliza-backend:
        condition: service_healthy
      eliza-vad:
        condition: service_healthy
      eliza-asr:
        condition: service_healthy
      eliza-emissor:
        condition: service_healthy
      eliza-eliza:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-monitoring:
    image: ghcr.io/leolani/cltl-monitoring:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring
    # Published because the chat UI's Monitoring tab is an iframe the *browser*
    # loads: [cltl.chat-ui] monitoring_url points at this host port, and the two
    # have to stay in step.
    ports:
      - "8004:8000"
    volumes:
      - ./config:/cltl-monitoring/config
      - ./storage:/cltl-monitoring/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-monitoring/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-chatui:
    image: ghcr.io/leolani/cltl-chat-ui:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-chatui
    ports:
      - "8003:8000"
    volumes:
      - ./config:/cltl-chatui/config
      - ./storage:/cltl-chatui/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-chatui/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

networks:
  eliza-network:
    driver: bridge
