services:
  rabbitmq:
    image: "rabbitmq:3.12-management"
    container_name: eliza-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP — exposed for remote clients
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=eliza
      - RABBITMQ_DEFAULT_PASS=eliza123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - ./storage/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - eliza-network

  eliza-backend:
    image: ghcr.io/leolani/cltl-backend:${VERSION:-latest}
    command: ["python", "src/storage_main.py"]
    container_name: eliza-backend
    ports:
      - "8001:8000"    # Storage API — exposed for remote clients
    volumes:
      - ./config-server:/cltl-backend/config
      - ./storage:/cltl-backend/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-backend/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - eliza-network

  eliza-vad:
    image: ghcr.io/leolani/cltl-vad:${VERSION:-latest}
    container_name: eliza-vad
    volumes:
      - ./config-server:/cltl-vad/config
      - ./storage:/cltl-vad/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-vad/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-asr:
    image: ghcr.io/leolani/cltl-asr:${VERSION:-latest}
    container_name: eliza-asr
    volumes:
      - ./config-server:/cltl-asr/config
      - ./storage:/cltl-asr/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-asr/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-emissor:
    image: ghcr.io/leolani/cltl-emissor-data:${VERSION:-latest}
    container_name: eliza-emissor
    ports:
      - "8002:8000"
    volumes:
      - ./config-server:/cltl-emissor-data/config
      - ./storage:/cltl-emissor-data/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-emissor-data/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

  eliza-eliza:
    image: ghcr.io/leolani/cltl-eliza:${VERSION:-latest}
    container_name: eliza-eliza
    volumes:
      - ./config-server:/cltl-eliza/config
      - ./storage:/cltl-eliza/storage
    environment:
      - CLTL_LOGGING_CONFIG=/cltl-eliza/config/logging.config
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eliza-network

networks:
  eliza-network:
    name: eliza-network
    driver: bridge
