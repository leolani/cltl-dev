[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --import-mode=importlib
# importlib import mode, because tests/slices/test_backend_vad.py and
# tests/compose/test_backend_vad.py are the same slice in the two tiers and are
# meant to share a name. Under the default prepend mode pytest derives a module
# name from the basename alone and refuses to collect the second one.

markers =
    compose: needs a Docker Compose stack of the real images (tier 2)
    slow: takes minutes — ASR model inference or image pulls
    manual: needs a human to observe the result; never run unattended

# Several CLTL services call `topic_worker.start().wait()` with no timeout, so a
# misconfigured topology hangs rather than fails. A hard timeout is the only
# thing that turns that into a readable test failure.
timeout = 300
timeout_method = thread

log_cli_level = INFO
